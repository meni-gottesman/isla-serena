# GitHub Pages build config.
#
# Sole purpose: keep internal files out of the PUBLISHED site. They stay in the
# repo, they just stop being fetchable from meni-gottesman.github.io/nevis-affair — which
# matters because that domain is printed on the invitations, and README.md
# documents the hosts password and internal to-dos.
#
# Do NOT add a .nojekyll file: that disables Jekyll, and `exclude` with it.
exclude:
  - README.md
  - SPEC.md
  - rsvp-backend.gs
  - qr-card.html
  - index-alt-meni.html
  - tools/
  - .gitignore
